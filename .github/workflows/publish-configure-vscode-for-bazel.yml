name: Publish configure-vscode-for-bazel to PyPI

on:
  push:
    tags:
      - 'configure-vscode-for-bazel-*'

permissions:
  contents: read
  packages: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/configure-vscode-for-bazel
    permissions:
      id-token: write # Required for trusted (OIDC) publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate tag version against pyproject.toml
        run: ./scripts/check_release.sh "${{ github.ref_name }}"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Build configure-vscode-for-bazel package
        run: uv build --package configure-vscode-for-bazel
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist/
